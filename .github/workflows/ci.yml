name: Minőségellenőrzés
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra gemini --python 3.12
      - run: uv run --extra gemini ruff check .
      - run: uv run --extra gemini ruff format --check .
      - run: uv run --extra gemini mypy src
      - run: uv run --extra gemini pytest
